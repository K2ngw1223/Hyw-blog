<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>写文章 · Hyw-blog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234ade80'/><text x='16' y='22' font-size='15' font-weight='bold' text-anchor='middle' fill='%2306210f' font-family='monospace'>H</text></svg>" />
<link rel="stylesheet" href="/vendor/hljs.css" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<header class="nav" id="nav"></header>

<main class="editor-page">
  <div class="editor-top">
    <input class="title" id="title" placeholder="给文章起个标题…" maxlength="120" />
    <span class="mono" id="saveState" style="font-size:11.5px;color:var(--text-3)"></span>
    <a class="btn btn-ghost btn-sm" href="/" id="backBtn">返回</a>
    <button class="btn btn-ghost" id="draftBtn">存草稿</button>
    <button class="btn btn-primary" id="publishBtn">发布</button>
  </div>

  <div class="editor-meta">
    <div class="field">
      <label>TAGS</label>
      <input type="text" id="tags" placeholder="用逗号分隔，例如：Node.js, 随笔" />
    </div>
    <div class="field">
      <label>COVER</label>
      <button class="btn btn-sm" id="coverBtn">上传封面</button>
      <span id="coverBox"></span>
    </div>
    <div class="field" style="margin-left:auto">
      <label>SUMMARY</label>
      <input type="text" id="summary" placeholder="留空自动从正文提取" maxlength="200" style="min-width:260px" />
    </div>
  </div>

  <div class="editor-body">
    <div class="pane">
      <div class="pane-head">
        <span>MARKDOWN</span>
        <span class="sp"></span>
        <div class="md-tools">
          <button data-md="h2" title="标题">H2</button>
          <button data-md="bold" title="加粗"><b>B</b></button>
          <button data-md="italic" title="斜体"><i>I</i></button>
          <button data-md="code" title="代码块">&lt;/&gt;</button>
          <button data-md="link" title="链接">link</button>
          <button data-md="quote" title="引用">&gt;</button>
          <button data-md="list" title="列表">•</button>
          <button data-md="img" title="插入图片">img</button>
        </div>
      </div>
      <textarea id="md" placeholder="用 Markdown 写点什么…&#10;&#10;支持代码块、表格、引用。&#10;图片可以直接拖进来或粘贴。" spellcheck="false"></textarea>
    </div>

    <div class="pane">
      <div class="pane-head"><span>PREVIEW</span><span class="sp"></span><span id="wc"></span></div>
      <div id="preview" class="prose"></div>
    </div>
  </div>
</main>

<input type="file" id="filePicker" accept="image/*" hidden />
<div class="drop-hint" id="dropHint">松手上传图片</div>

<script type="module" src="/js/editor.js"></script>
</body>
</html>
