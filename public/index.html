<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hyw-blog</title>
<meta name="description" content="站长的个人博客 —— 代码、想法与碎片。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234ade80'/><text x='16' y='22' font-size='15' font-weight='bold' text-anchor='middle' fill='%2306210f' font-family='monospace'>KA</text></svg>" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<header class="nav" id="nav"></header>

<main>
  <section class="wrap hero" id="hero"></section>

  <section class="wrap">
    <div class="section-head">
      <div class="tabs" id="tabs">
        <button data-scope="owner">站长文章</button>
        <button data-scope="community">社区文章</button>
        <button data-scope="all">全部</button>
      </div>
      <div class="section-title" id="listInfo"></div>
      <div style="margin-left:auto" id="clearBox"></div>
    </div>

    <div class="tagbar" id="tagbar"></div>

    <div class="posts two" id="posts">
      <div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div>
    </div>

    <div style="text-align:center;margin-top:28px" id="moreBox"></div>
  </section>
</main>

<footer class="wrap" id="footer"></footer>

<script type="module" src="/js/home.js"></script>
</body>
</html>
